name: Build and Push to GHCR

on:
  push:
    branches: [main]
  # Also build immutable images for release tags, e.g. v1.2.3
  # tags: ["v*"]

# If several commits land on main quickly, only finish the newest build.
concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

# The ephemeral, per-run GITHUB_TOKEN needs write on packages to push to GHCR.
# No personal access token required.
permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Deploy gate: run the committed generated Playwright suite against a live
  # app. Blocks the image push only on NEW regressions vs e2e/generated-baseline.json
  # (see e2e/scripts/check-generated-gate.mjs for why intrinsic defect-reds are
  # tolerated — CLAUDE.md rule 2 forbids fixing D1-D4).
  # ---------------------------------------------------------------------------
  e2e-generated:
    name: Gate — generated Playwright suite
    runs-on: ubuntu-latest
    # The SHOPCHECK_* seed credentials are stored as *environment* secrets under
    # the `beta` environment; a job must claim the environment to read them.
    environment: beta
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start ShopCheck (uvicorn; DB seeded on lifespan startup)
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/openapi.json >/dev/null && { echo "app is up"; exit 0; }
            sleep 1
          done
          echo "::error::ShopCheck did not become ready on :8000"; cat uvicorn.log; exit 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install harness dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser (chromium)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run generated suite
        working-directory: e2e
        # A red exit here must NOT fail the step — the baseline gate below is
        # the arbiter. `|| true` keeps Playwright's JSON report as the source
        # of truth instead of the raw exit code.
        run: npx playwright test tests/generated || true
        env:
          CI: "true"
          SHOPCHECK_BASE_URL: http://127.0.0.1:8000
          # Seed credentials (APP_SPEC §12) — supplied as repo secrets so no
          # credential literal lands in a committed file (CLAUDE.md rule 4).
          SHOPCHECK_ADMIN: ${{ secrets.SHOPCHECK_ADMIN }}
          SHOPCHECK_ADMIN_PASSWORD: ${{ secrets.SHOPCHECK_ADMIN_PASSWORD }}
          SHOPCHECK_STANDARD_USER: ${{ secrets.SHOPCHECK_STANDARD_USER }}
          SHOPCHECK_STANDARD_USER_PASSWORD: ${{ secrets.SHOPCHECK_STANDARD_USER_PASSWORD }}
          SHOPCHECK_PROBLEM_USER: ${{ secrets.SHOPCHECK_PROBLEM_USER }}
          SHOPCHECK_PROBLEM_USER_PASSWORD: ${{ secrets.SHOPCHECK_PROBLEM_USER_PASSWORD }}
          SHOPCHECK_LOCKED_OUT_USER: ${{ secrets.SHOPCHECK_LOCKED_OUT_USER }}
          SHOPCHECK_LOCKED_OUT_USER_PASSWORD: ${{ secrets.SHOPCHECK_LOCKED_OUT_USER_PASSWORD }}
          SHOPCHECK_NEW_CUSTOMER: ${{ secrets.SHOPCHECK_NEW_CUSTOMER }}
          SHOPCHECK_NEW_CUSTOMER_PASSWORD: ${{ secrets.SHOPCHECK_NEW_CUSTOMER_PASSWORD }}

      - name: Gate — block deploy only on NEW regressions
        working-directory: e2e
        run: node scripts/check-generated-gate.mjs

      - name: Upload Playwright report + results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-playwright-report
          path: |
            e2e/test-results/results.json
            e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  build-and-push:
    name: Build and push image
    needs: [e2e-generated]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives lowercase image name + tags/labels from repo metadata.
      # ghcr.io/<owner>/ShopCheck is lowercased to .../shopcheck automatically.
      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse the layer cache across runs for faster builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
