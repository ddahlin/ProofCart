name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # manual "Run workflow" button + `gh workflow run ci.yml`

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite (includes UI-model drift guard)
        run: pytest -q

      - name: Guard — docs/ must not leak build-layer terms (CLAUDE.md rule 1 / APP_SPEC §16.4)
        run: |
          if grep -riE "defect|DEFECT_MODE|ground.?truth|planted|deliberate|APP_SPEC|QA agent" docs/; then
            echo "::error::Forbidden build-layer term found in docs/ (agent-facing layer)."
            exit 1
          fi
          echo "docs/ clean."

      - name: Guard — UI-model export self-validates and leaks nothing
        run: python tools/export_ui_model.py --out /tmp/ci_out
