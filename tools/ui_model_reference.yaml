          value: Description
      admin_p_name:
        fallback:
          by: getByTestId
          value: admin-p-name
        preferred:
          by: getByLabel
          value: Name
      admin_p_price:
        fallback:
          by: getByTestId
          value: admin-p-price
        preferred:
          by: getByLabel
          value: Price
      admin_p_stock:
        fallback:
          by: getByTestId
          value: admin-p-stock
        preferred:
          by: getByLabel
          value: Stock
      admin_products_table:
        preferred:
          by: getByTestId
          value: admin-products-table
      admin_r_from:
        fallback:
          by: getByTestId
          value: admin-r-from
        preferred:
          by: getByLabel
          value: From
      admin_r_title:
        fallback:
          by: getByTestId
