# AUTO-GENERATED structural snapshot of the ShopCheck UI model.
# Regenerate with: python tools/export_ui_model.py --write-reference
# The drift-guard test (tests/test_ui_model_export.py) fails if the app's
# rendered structure diverges from this file. Do not hand-edit.
manifest:
  app_id: shopcheck
  base_url_key: SHOPCHECK_BASE_URL
  display_name: ShopCheck
  schema_version: 1
  source_type: build_artifact
pages:
  AdminDashboardPage:
    description: 'The admin dashboard: users, products, and reports tables, each with
      a create form, plus a message line.'
    elements:
      admin_create_product:
        fallback:
          by: getByTestId
          value: admin-create-product
        preferred:
          by: getByRole
          name: Create product
          role: button
      admin_create_report:
        fallback:
          by: getByTestId
          value: admin-create-report
        preferred:
          by: getByRole
          name: Create report
