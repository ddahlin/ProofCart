      admin_create_user:
        fallback:
          by: getByTestId
          value: admin-create-user
        preferred:
          by: getByRole
          name: Create user
          role: button
      admin_message:
        fallback:
          by: getByTestId
          value: admin-message
        preferred:
          by: getByRole
          role: alert
      admin_new_password:
        fallback:
          by: getByTestId
          value: admin-new-password
        preferred:
          by: getByLabel
          value: Password
      admin_new_role:
        fallback:
          by: getByTestId
          value: admin-new-role
        preferred:
          by: getByLabel
          value: Role
      admin_new_username:
        fallback:
          by: getByTestId
