      admin_r_type:
        fallback:
          by: getByTestId
          value: admin-r-type
        preferred:
          by: getByLabel
          value: Type
      admin_reports_table:
        preferred:
          by: getByTestId
          value: admin-reports-table
      admin_users_table:
        preferred:
          by: getByTestId
          value: admin-users-table
    page_object: AdminDashboardPage
    url_path_key: admin
  AppHeader:
    description: 'Shared top navigation bar rendered on every authenticated page:
      catalog, cart, orders, admin links and the log-out button.'
    elements:
      nav_admin:
        fallback:
          by: getByTestId
          value: nav-admin
        preferred:
          by: getByRole
          name: Admin
          role: link
      nav_cart:
        fallback:
          by: getByTestId
          value: nav-cart
        preferred:
          by: getByRole
          name: Cart
          role: link
      nav_catalog:
        fallback:
          by: getByTestId
          value: nav-catalog
        preferred:
          by: getByRole
          name: Catalog
          role: link
      nav_logout:
        fallback:
          by: getByTestId
          value: nav-logout
        preferred:
          by: getByRole
          name: Log out
          role: button
      nav_orders:
        fallback:
          by: getByTestId
          value: nav-orders
        preferred:
          by: getByRole
          name: Orders
          role: link
    page_object: AppHeader
    shared: true
    url_path_key: catalog
  CartPage:
    description: 'The shopping cart: the line-item table, the running total, and the
      place-order button, plus a message line.'
    elements:
      cart_checkout:
        fallback:
          by: getByTestId
          value: cart-checkout
        preferred:
          by: getByRole
          name: Place order
          role: button
      cart_empty:
        preferred:
          by: getByTestId
          value: cart-empty
      cart_message:
        fallback:
          by: getByTestId
          value: cart-message
        preferred:
          by: getByRole
          role: alert
      cart_table:
        preferred:
          by: getByTestId
          value: cart-table
      cart_total:
        preferred:
          by: getByTestId
          value: cart-total
    page_object: CartPage
    url_path_key: cart
  CatalogPage:
    description: 'The product catalog: one card per active product with a quantity
      field and an add-to-cart button, plus a status message line.'
    element_templates:
      add_to_cart:
        conditional: false
        param: product_id
        param_source: test_data.products[].id
        preferred:
          by: getByTestId
          value: add-to-cart-{product_id}
      catalog_product:
        conditional: false
        param: product_id
        param_source: test_data.products[].id
        preferred:
          by: getByTestId
          value: catalog-product-{product_id}
      catalog_qty:
        conditional: false
        param: product_id
        param_source: test_data.products[].id
        preferred:
          by: getByTestId
          value: catalog-qty-{product_id}
    elements:
      catalog_message:
        fallback:
          by: getByTestId
          value: catalog-message
        preferred:
          by: getByRole
          role: status
    page_object: CatalogPage
    url_path_key: catalog
  LoginPage:
    description: 'The sign-in page: a username field, a password field, a submit button,
      and an inline error banner shown after a failed attempt.'
    elements:
      login_error:
        conditional: true
        fallback:
          by: getByTestId
          value: login-error
        preferred:
          by: getByRole
          role: alert
      login_password:
        fallback:
          by: getByTestId
          value: login-password
        preferred:
          by: getByLabel
          value: Password
      login_submit:
        fallback:
          by: getByTestId
          value: login-submit
        preferred:
          by: getByRole
          name: Sign in
          role: button
      login_username:
        fallback:
          by: getByTestId
          value: login-username
        preferred:
          by: getByLabel
          value: Username
    page_object: LoginPage
    url_path_key: login
  OrdersPage:
    description: 'The order history table: one row per order with a status badge and
      a cancel action for open orders.'
    element_templates:
      order_cancel:
        conditional: false
        param: order_id
        param_source: test_data.orders[].id
        preferred:
          by: getByTestId
          value: order-cancel-{order_id}
      order_row:
        conditional: false
        param: order_id
        param_source: test_data.orders[].id
        preferred:
          by: getByTestId
          value: order-row-{order_id}
      order_status:
        conditional: false
        param: order_id
        param_source: test_data.orders[].id
        preferred:
          by: getByTestId
          value: order-status-{order_id}
    elements:
      orders_message:
        fallback:
          by: getByTestId
          value: orders-message
        preferred:
          by: getByRole
          role: alert
    page_object: OrdersPage
    url_path_key: orders
