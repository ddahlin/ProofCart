<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShopCheck{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1c2430; }
    header { background: #1f2d3d; color: #fff; display: flex; align-items: center; gap: 1.25rem; padding: 0.6rem 1.25rem; }
    header .brand { font-weight: 700; font-size: 1.1rem; margin-right: 1rem; }
    header a { color: #cfd8e3; text-decoration: none; }
    header a:hover { color: #fff; }
    header .spacer { flex: 1; }
    header .who { color: #9fb3c8; font-size: 0.9rem; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 4px; padding: 0.4rem 0.8rem; cursor: pointer; }
    button.secondary { background: #64748b; }
    button.danger { background: #dc2626; }
    main { max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 0.5rem 0.65rem; border-bottom: 1px solid #e2e8f0; }
    th { background: #eef2f7; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
    .muted { color: #64748b; font-size: 0.85rem; }
    .error { color: #b91c1c; }
    .ok { color: #15803d; }
    input, select { padding: 0.4rem; border: 1px solid #cbd5e1; border-radius: 4px; width: 100%; margin-bottom: 0.6rem; }
    label { font-size: 0.85rem; color: #475569; display: block; margin-bottom: 0.15rem; }
    h1 { font-size: 1.4rem; }
    .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; background: #e2e8f0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
<header>
  <span class="brand">ShopCheck</span>
  {% if session %}
    <a href="/catalog" data-testid="nav-catalog">Catalog</a>
    <a href="/cart" data-testid="nav-cart">Cart</a>
    <a href="/orders" data-testid="nav-orders">Orders</a>
    {% if session.role == 'admin' %}<a href="/admin" data-testid="nav-admin">Admin</a>{% endif %}
    <span class="spacer"></span>
    <span class="who">{{ session.username }} ({{ session.role }})</span>
    <button id="logout-btn" data-testid="nav-logout" class="secondary" type="button">Log out</button>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
{% if session and not omit_logout_handler %}
<script>
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', {method: 'POST'});
    window.location.href = '/login';
  });
</script>
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
